# 本番 DB のスキーマ・マイグレーション（手動実行）。
#
# SQLite + Litestream は「書き込み手が同時に 1 つ」でなければならない。
# そのため以下の順で単一ライタ窓を作って実行する（docs/gcp-deployment-design.md §10）:
#   1. イメージをビルド & push
#   2. サービスを min=0 に退避（現行インスタンスを撤退）
#   3. Litestream レプリカを backups/ へスナップショット
#   4. マイグレーション Job を実行（restore → migrate → 確定）
#   5. サービスを新イメージ + min=1 で復帰
#
# ⚠️ 利用者がいない時間帯に実行すること（退避中も短時間はアクセスされうる）。
name: migrate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "実行するには 'migrate' と入力"
        required: true
        default: ""
      grace_seconds:
        description: "min=0 退避後に待つ秒数（現行インスタンスの撤退待ち）"
        required: false
        default: "90"

concurrency:
  group: migrate-prod
  cancel-in-progress: false

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.SERVICE_NAME }}/app
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: ${{ vars.SERVICE_NAME }}
  JOB: ${{ vars.SERVICE_NAME }}-migrate

jobs:
  migrate:
    if: ${{ github.event.inputs.confirm == 'migrate' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push image
        run: |
          set -euo pipefail
          docker build -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:${{ github.sha }}"

      - name: Point migrate job at new image
        run: |
          set -euo pipefail
          gcloud run jobs update "$JOB" --image "$IMAGE:${{ github.sha }}" --region "$REGION" --quiet

      - name: Retreat service to single-writer window (min=0)
        run: |
          set -euo pipefail
          gcloud run services update "$SERVICE" --min-instances=0 --region "$REGION" --quiet
          echo "現行インスタンスの撤退を待機: ${{ github.event.inputs.grace_seconds }}s"
          sleep "${{ github.event.inputs.grace_seconds }}"

      - name: Backup current Litestream replica
        run: |
          set -euo pipefail
          BUCKET="${{ vars.GCP_PROJECT_ID }}-${SERVICE}-state"
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "バックアップ先: gs://$BUCKET/backups/$TS/litestream"
          # レプリカが未作成（初回）ならスキップ。
          if gcloud storage ls "gs://$BUCKET/litestream" >/dev/null 2>&1; then
            gcloud storage cp --recursive \
              "gs://$BUCKET/litestream" "gs://$BUCKET/backups/$TS/litestream"
          else
            echo "レプリカ未作成のためバックアップをスキップ。"
          fi

      - name: Run migration job
        run: |
          set -euo pipefail
          gcloud run jobs execute "$JOB" --region "$REGION" --wait

      - name: Restore service with new image (min=1)
        if: always()
        run: |
          set -euo pipefail
          gcloud run services update "$SERVICE" \
            --image "$IMAGE:${{ github.sha }}" \
            --min-instances=1 \
            --region "$REGION" --quiet
