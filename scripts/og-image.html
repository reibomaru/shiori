<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      :root {
        --base: #0b1120;
        --accent: #22d3ee;
        --accent-2: #a06bff;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background-color: var(--base);
        /* .tech-mesh と同じ語彙：シアン/パープルの微光 + 薄いグリッドメッシュ */
        background-image:
          radial-gradient(900px 460px at 100% -12%, rgba(160, 107, 255, 0.22), transparent 60%),
          radial-gradient(900px 460px at 0% 0%, rgba(34, 211, 238, 0.18), transparent 55%),
          linear-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
        background-size: auto, auto, 36px 36px, 36px 36px;
        font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
        color: #e2e8f0;
      }
      /* 外周のネオンリング（内側 inset） */
      .frame {
        position: absolute;
        inset: 0;
        box-shadow: inset 0 0 0 1px rgba(34, 211, 238, 0.14);
      }
      .content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 84px 96px;
      }
      .brandline {
        display: flex;
        align-items: center;
        gap: 22px;
        margin-bottom: 38px;
      }
      .wordmark {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 62px;
        font-weight: 700;
        letter-spacing: 0.02em;
        background-image: linear-gradient(120deg, var(--accent), var(--accent-2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .headline {
        font-size: 66px;
        font-weight: 800;
        line-height: 1.22;
        letter-spacing: 0.01em;
        color: #f8fafc;
      }
      .headline .hl {
        background-image: linear-gradient(120deg, var(--accent), var(--accent-2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .sub {
        margin-top: 30px;
        font-size: 25px;
        line-height: 1.62;
        color: #94a3b8;
        max-width: 1030px;
      }
      .sub .em {
        color: #cbd5e1;
        font-weight: 700;
      }
      .chips {
        margin-top: 40px;
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        font-size: 22px;
        padding: 9px 22px;
        border-radius: 999px;
        color: #cbd5e1;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(34, 211, 238, 0.18);
      }
      .chip svg {
        width: 22px;
        height: 22px;
        fill: #67e8f9;
        flex: none;
      }
      .url {
        position: absolute;
        right: 96px;
        top: 72px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 26px;
        color: #7c8db5;
        letter-spacing: 0.03em;
      }
    </style>
  </head>
  <body>
    <div class="frame"></div>
    <div class="content">
      <div class="brandline">
        <!-- ロゴマーク（favicon 準拠のアプリアイコン）: 候補ネットワーク → 確定ルート -->
        <svg width="92" height="92" viewBox="0 0 32 32">
          <defs>
            <linearGradient id="route" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#22d3ee" />
              <stop offset="1" stop-color="#a06bff" />
            </linearGradient>
          </defs>
          <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="#0b1020"
            stroke="#22d3ee" stroke-opacity="0.22" stroke-width="0.6" />
          <!-- dim network -->
          <g stroke="#33406a" stroke-width="1" stroke-linecap="round">
            <line x1="7" y1="14" x2="11" y2="23" />
            <line x1="11" y1="23" x2="19" y2="25" />
            <line x1="14" y1="10" x2="11" y2="23" />
            <line x1="21" y1="15" x2="19" y2="25" />
            <line x1="19" y1="25" x2="26" y2="22" />
          </g>
          <g fill="#33406a">
            <circle cx="11" cy="23" r="1.3" />
            <circle cx="19" cy="25" r="1.3" />
          </g>
          <!-- highlighted route -->
          <path d="M7 14 L14 10 L21 15 L26 22" fill="none" stroke="url(#route)"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          <g fill="url(#route)">
            <circle cx="7" cy="14" r="2" />
            <circle cx="14" cy="10" r="2" />
            <circle cx="21" cy="15" r="2" />
            <circle cx="26" cy="22" r="2" />
          </g>
        </svg>
        <span class="wordmark">shiori</span>
      </div>

      <div class="headline">
        AI エージェントが、<br /><span class="hl">旅程まるごと</span>組み立てる。
      </div>
      <div class="sub">
        スポット検索・現地の情報収集から、日ごとの旅程づくりまで AI が実行。<br />
        地図・予算・メモまで揃った、<span class="em">あなたに最適なオーダーメイド</span>のしおりが完成。
      </div>
      <div class="chips">
        <span class="chip">
          <svg viewBox="0 0 576 512"><path d="M408 120c0 54.6-73.1 151.9-105.2 192c-7.7 9.6-22 9.6-29.6 0C241.1 271.9 168 174.6 168 120C168 53.7 221.7 0 288 0s120 53.7 120 120zm8 80.4c3.5-6.9 6.7-13.8 9.6-20.6c.5-1.2 1-2.5 1.5-3.7l116-46.4C558.9 123.4 576 135 576 152l0 270.8c0 9.8-6 18.6-15.1 22.3L416 503l0-302.6zM137.6 138.3c2.4 14.1 7.2 28.3 12.8 41.5c2.9 6.8 6.1 13.7 9.6 20.6l0 251.4L32.9 502.7C17.1 509 0 497.4 0 480.4L0 209.6c0-9.8 6-18.6 15.1-22.3l122.6-49zM327.8 332c13.9-17.4 35.7-45.7 56.2-77l0 249.3L192 449.4 192 255c20.5 31.3 42.3 59.6 56.2 77c20.5 25.6 59.1 25.6 79.6 0zM288 152a40 40 0 1 0 0-80 40 40 0 1 0 0 80z"/></svg>
          地図・ルート
        </span>
        <span class="chip">
          <svg viewBox="0 0 448 512"><path d="M152 24c0-13.3-10.7-24-24-24s-24 10.7-24 24l0 40L64 64C28.7 64 0 92.7 0 128l0 16 0 48L0 448c0 35.3 28.7 64 64 64l320 0c35.3 0 64-28.7 64-64l0-256 0-48 0-16c0-35.3-28.7-64-64-64l-40 0 0-40c0-13.3-10.7-24-24-24s-24 10.7-24 24l0 40L152 64l0-40zM48 192l80 0 0 56-80 0 0-56zm0 104l80 0 0 64-80 0 0-64zm128 0l96 0 0 64-96 0 0-64zm144 0l80 0 0 64-80 0 0-64zm80-48l-80 0 0-56 80 0 0 56zm0 160l0 40c0 8.8-7.2 16-16 16l-64 0 0-56 80 0zm-128 0l0 56-96 0 0-56 96 0zm-144 0l0 56-64 0c-8.8 0-16-7.2-16-16l0-40 80 0zM272 248l-96 0 0-56 96 0 0 56z"/></svg>
          旅程
        </span>
        <span class="chip">
          <svg viewBox="0 0 512 512"><path d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zm50.7-186.9L162.4 380.6c-19.4 7.5-38.5-11.6-31-31l55.5-144.3c3.3-8.5 9.9-15.1 18.4-18.4l144.3-55.5c19.4-7.5 38.5 11.6 31 31L325.1 306.7c-3.2 8.5-9.9 15.1-18.4 18.4zM288 256a32 32 0 1 0 -64 0 32 32 0 1 0 64 0z"/></svg>
          スポット
        </span>
        <span class="chip">
          <svg viewBox="0 0 512 512"><path d="M64 32C28.7 32 0 60.7 0 96L0 416c0 35.3 28.7 64 64 64l384 0c35.3 0 64-28.7 64-64l0-224c0-35.3-28.7-64-64-64L80 128c-8.8 0-16-7.2-16-16s7.2-16 16-16l368 0c17.7 0 32-14.3 32-32s-14.3-32-32-32L64 32zM416 272a32 32 0 1 1 0 64 32 32 0 1 1 0-64z"/></svg>
          予算
        </span>
        <span class="chip">
          <svg viewBox="0 0 576 512"><path d="M234.7 42.7L197 56.8c-3 1.1-5 4-5 7.2s2 6.1 5 7.2l37.7 14.1L248.8 123c1.1 3 4 5 7.2 5s6.1-2 7.2-5l14.1-37.7L315 71.2c3-1.1 5-4 5-7.2s-2-6.1-5-7.2L277.3 42.7 263.2 5c-1.1-3-4-5-7.2-5s-6.1 2-7.2 5L234.7 42.7zM46.1 395.4c-18.7 18.7-18.7 49.1 0 67.9l34.6 34.6c18.7 18.7 49.1 18.7 67.9 0L529.9 116.5c18.7-18.7 18.7-49.1 0-67.9L495.3 14.1c-18.7-18.7-49.1-18.7-67.9 0L46.1 395.4zM484.6 82.6l-105 105-23.3-23.3 105-105 23.3 23.3zM7.5 117.2C3 118.9 0 123.2 0 128s3 9.1 7.5 10.8L64 160l21.2 56.5c1.7 4.5 6 7.5 10.8 7.5s9.1-3 10.8-7.5L128 160l56.5-21.2c4.5-1.7 7.5-6 7.5-10.8s-3-9.1-7.5-10.8L128 96 106.8 39.5C105.1 35 100.8 32 96 32s-9.1 3-10.8 7.5L64 96 7.5 117.2zm352 256c-4.5 1.7-7.5 6-7.5 10.8s3 9.1 7.5 10.8L416 416l21.2 56.5c1.7 4.5 6 7.5 10.8 7.5s9.1-3 10.8-7.5L480 416l56.5-21.2c4.5-1.7 7.5-6 7.5-10.8s-3-9.1-7.5-10.8L480 352l-21.2-56.5c-1.7-4.5-6-7.5-10.8-7.5s-9.1 3-10.8 7.5L416 352l-56.5 21.2z"/></svg>
          AI アシスタント
        </span>
      </div>
    </div>
    <div class="url">booklet-ai.com</div>
  </body>
</html>
